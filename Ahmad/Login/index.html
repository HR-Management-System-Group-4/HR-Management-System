<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Demo Login | Mysta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/Colors.css">
  <link rel="stylesheet" href="../../layout/header.css">
  <link rel="stylesheet" href="../../layout/footer.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nav-bar"></div>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-icon"><i class="bi bi-person-lock" aria-hidden="true"></i></div>
      <p class="eyebrow">MYSTA / HR WORKSPACE</p>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="intro">Sign in as HR to open your dashboard.</p>
      <form id="loginForm">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" value="hr@mysta.demo" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" class="error" role="alert" hidden>Check the demo email and password below.</p>
        <button type="submit">Sign in to HR dashboard <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
      </form>
      <p class="demo-credentials">Demo access: <strong>hr@mysta.demo</strong> / <strong>demo1234</strong></p>
    </section>
  </main>
  <div class="footer"></div>
  <script src="../../layout/header.js"></script>
  <script src="../../layout/footer.js"></script>
  <script src="main.js"></script>
  <script src="../../demo/flow.js"></script>
</body>
</html>
