<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../../assets/Logo-cropped.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../../assets/Colors.css">
    <link rel="stylesheet" href="../../layout/header.css">
    <link rel="stylesheet" href="../../layout/footer.css">
    <link rel="stylesheet" href="Employee_Task.css">
    <link rel="stylesheet" href="open_task_employee.css">
    <link rel="stylesheet" href="../../layout/page-transition.css">
    <script src="../../layout/page-transition.js"></script>
</head>

<body>

    <div class="nav-bar"></div>
    <main class="container">
        <a href="../../Timaaa/services/index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Services
        </a>

        <div class="header-section">
            <span class="subtitle">MY ASSIGNMENTS</span>
            <h2>My Tasks</h2>
            <p>
                View your assigned tasks, track their progress,
                and submit your solutions before the deadline.
            </p>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stat-card" style="display: flex;">
                    <div class="stat-icon">
                       <i class="fa-regular fa-clock"></i>
                     </div>
                    <div>
                    <h3 id="PendingCount">0</h3>
                    <p>Pending</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3" >
                <div class="stat-card" style="display: flex;">
                     <div class="stat-icon">
                        <i class="bi bi-arrow-repeat"></i>
                     </div>
                     <div>
                    <h3 id="progressCount">0</h3>
                    <p>In Progress</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
              
                <div class="stat-card" style="display: flex;">
                   <div class="stat-icon"><i class="bi bi-inbox"></i></div>
                   <div>
                    <h3 id="SubmittedCount">0</h3>
                    <p>Submitted</p>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card" style="display: flex;">
                     <div class="stat-icon">
                        <i class="bi bi-check-circle-fill"></i>
                     </div>
                    <div>
                    <h3 id="completedCount">0</h3>
                    <p>Completed</p>
                    </div>
                </div>
            </div>

        </div>

        <div class="filter-tabs mb-4">
            <button class="filter-btn" id="ALL">All</button>
            <button class="filter-btn" id="filter_pending">Pending</button>
            <button class="filter-btn" id="filter_progress">In Progress</button>
            <button class="filter-btn" id="filter_submition">Submitted</button>
            <button class="filter-btn" id="filter_completed">Completed</button>
        </div>
        <div id="tasksContainer" class="row row-cols-1 row-cols-md-3 g-4"></div>

    </main>
    <!-- Popup Page -->
    <div class="task-modal-overlay" id="taskModal" style="display: none;">
        <div class="task-modal-content">
            <div class="modal-header-section">
                <div>
                    <h3 class="modal-title" id="modalTaskTitle"></h3>
                    <div class="badge-group">
                     <span class="priority low" id="modalPriority"></span>
                     <span class="state completed" id="modalStatus"></span>
                    </div>
                </div>
                <button class="close-btn" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <p class="modal-desc" id="modalTaskDescription"></p>
            <div class="dates-grid">
                <div class="date-item">
                    <span class="date-label">Assigned Date</span>
                    <span class="date-value" id="modalAssignedDate"></span>
                </div>
                <div class="date-item">
                    <span class="date-label">Deadline</span>
                    <span class="date-value" id="modalDueDate"></span>
                </div>
            </div>
            <div class="hr-notes-box">
                <h4 class="notes-heading"> HR Notes</h4>
                <p class="notes-text" id="modalHrNotes"></p>
            </div>

            <p id="deadlineMsg" class="deadline-msg"></p>
            <div class="solution-section">
                <label class="solution-label"> Your Solution</label>
                <textarea id="userSolution" class="solution-textarea" placeholder="Write your description for solution or add links here..."></textarea>
            </div>
            <div class="solution-section">
                <label class="solution-label" for="solutionFile">Attach a file (optional, up to 1 MB)</label>
                <input type="file" id="solutionFile"><span id="fileName"></span>
            </div>
            <p id="errorMsg" style="display: none; color: #d9534f;"></p>
            <button id="btn-submit-solution" class="btn-submit-solution"> Submit Solution </button>
            <button id="btn-Edite-solution"class="btn-Edite-solution" style="display: none;">Edit</button>
        </div>

    </div>
 <div class="footer" style="margin-top:auto;"></div>

    <script src="../../layout/header.js"></script>
    <script src="../../layout/footer.js"></script>
    <script src="open_task_employee.js?v=20261004-review"></script>
</body>
</html>
