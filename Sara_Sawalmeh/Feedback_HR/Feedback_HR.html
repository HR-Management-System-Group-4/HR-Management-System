<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System - Employee Feedback</title>
    <link rel="stylesheet" href="../../assets/Colors.css">
    <link rel="stylesheet" href="Feedback_HR.css">
    <link rel="stylesheet" href="../../Side_Bar/embed.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../layout/page-transition.css">
    <script src="../../layout/page-transition.js"></script>
</head>

<body class="hr-page">

    <button class="hr-nav-toggle" type="button" aria-controls="hrNavigation" aria-expanded="false" aria-label="Open HR menu">☰ HR menu</button>
    <button class="hr-nav-backdrop" type="button" aria-label="Close HR menu" hidden></button>
    <iframe id="hrNavigation" class="hr-navigation" src="../../Side_Bar/Side_bar.html" title="HR navigation"></iframe>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h1>Employee Feedback</h1>
                <p>Review and respond to feedback submitted by employees.</p>
            </div>
            <div class="admin-profile">
                <span>Rachel Carter</span>
                <small>HR Admin</small>
            </div>
        </header>
        <section class="stats-container">
            <div class="stat-card">
                <h3 id="newCount">0</h3>
                <span>New</span>
            </div>
            <div class="stat-card">
                <h3 id="reviewedCount">0</h3>
                <span>Reviewed</span>
            </div>
        </section>
        <section class="filter-tabs">
            <button class="tab-btn active">All</button>
            <button class="tab-btn">New</button>
            <button class="tab-btn">Reviewed</button>
        </section>
        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>EMPLOYEE</th>
                        <th>SUBJECT</th>
                        <th>MESSAGE</th>
                        <th>DATE</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody class="feedbacks"></tbody>
            </table>
        </section>
    </main>
    <script src="Feedback_HR.js"></script>
    <script src="../../Side_Bar/embed.js"></script>

  <script src="../../demo/flow.js"></script>
</body>

</html>
