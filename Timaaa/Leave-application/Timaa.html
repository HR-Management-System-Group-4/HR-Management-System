<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../../assets/Logo-cropped.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Leave Application</title>
<link rel="stylesheet" href="../../assets/Colors.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../../layout/header.css">
<link rel="stylesheet" href="../../layout/footer.css">
<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../layout/page-transition.css">
  <script src="../../layout/page-transition.js"></script>
</head>
<body>
<div class="nav-bar"></div>
<main class="page">
<!-- =========================
     BACK TO SERVICES
========================= -->
<div class="back-service">
    <a href="../services/index.html">
        <i class="bi bi-arrow-left"></i>
        Back to Services
    </a>
</div>
<div class="page-header">
<span class="subtitle">
EMPLOYEE SERVICES
</span>
<h1>
Leave Application
</h1>
<p>
Submit your leave request for HR review and approval.
</p>
</div>

<div class="leave-layout">
<div class="form-card">
<form id="leaveForm">
<div class="employee-box">
<img
id="employeeImage"
src="images.jpg"
alt="Employee"
class="employee-image">

<div class="employee-info">
<h3 id="employeeName">
Employee
</h3>

<p id="employeeInfo">
Position • EMP001
</p>
</div>

</div>
<div class="form-group">
<label>
Leave Type <span>*</span>
</label>
<select id="leaveType">
<option value="">
Select leave type...
</option>
<option value="Annual Leave">
Annual Leave
</option>
<option value="Sick Leave">
Sick Leave
</option>
<option value="Emergency Leave">
Emergency Leave
</option>
<option value="Unpaid Leave">
Unpaid Leave
</option>

<option value="Others">
Others
</option>
</select>
<p id="leaveTypeError" class="error-message"></p>
</div>

<div class="form-group"
id="otherLeaveBox"
style="display:none;">

<label>
Specify Leave Type
</label>
<input
type="text"
id="otherLeaveInput"
placeholder="Enter leave type">
<p id="otherLeaveError" class="error-message"></p>

</div>

<div class="date-row">
<div class="form-group">
<label>
Start Date <span>*</span>
</label>
<input
type="date"
id="startDate">
<p id="startDateError" class="error-message"></p>
</div>
<div class="form-group">
<label>
End Date <span>*</span>
</label>
<input
type="date"
id="endDate">
<p id="endDateError" class="error-message"></p>
</div>
</div>
<!-- HOURS -->
<div class="form-group"
id="hoursGroup"
style="display:none;">
<label>
Hours <span>*</span>
</label>
<input
type="number"
id="hours"
min="1"
max="24"
placeholder="Enter number of hours">
<p id="hoursError" class="error-message"></p>
</div>
<!-- REASON -->
<div class="form-group">
<label>
Reason for Leave <span>*</span>
</label>
<textarea
id="reason"
maxlength="500"
placeholder="Please provide details about your leave request..."></textarea>

<div class="textarea-footer">

<span>
Minimum 10 characters required
</span>
<span id="charCount">
0 chars
</span>
</div>
<p id="reasonError" class="error-message"></p>

</div>
<!-- BUTTONS -->
<div class="buttons">
<button
type="submit"
class="submit-button">
Submit Application
</button>

<button
type="button"
class="cancel-button"
id="cancelButton">
Cancel
</button>

</div>
</form>
</div>

<!-- REQUEST HISTORY -->

<section class="request-history">
<h2>
My leave requests
</h2>

<div class="request-history-list">
</div>
</section>
</div>
</main>
<dialog id="successDialog" class="success-dialog">

<div class="success-card">


<div class="success-icon">
<i class="bi bi-check-lg"></i>
</div>


<h2>
Changes Saved!
</h2>


<p>
Your leave application has been submitted successfully.
</p>


<button id="successOk">
OK
</button>


</div>

</dialog>
<div class="footer"></div>
<script src="../../layout/header.js"></script>
<script src="../../layout/footer.js"></script>
<script src="script.js"></script>
<script src="../../demo/flow.js"></script>
</body>
</html>
