<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../../assets/Logo-cropped.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../layout/page-transition.css">
    <script src="../../layout/page-transition.js"></script>
</head>

<body>

    <!-- LEFT SIDE -->
    <div class="left">

    <div class="space">

        <!-- Stars -->
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>
        <span class="star s5"></span>
        <span class="star s6"></span>
        <span class="star s7"></span>
        <span class="star s8"></span>
        <span class="star s9"></span>
        <span class="star s10"></span>
        <span class="star s11"></span>
        <span class="star s12"></span>

        <!-- Orbits -->
        <div class="orbit orbit1">
            <span class="planet"></span>
        </div>

        <div class="orbit orbit2">
            <span class="planet"></span>
        </div>

        <div class="orbit orbit3">
            <span class="planet"></span>
        </div>

        <!-- Logo -->
        <div class="logo">
            <img src="../../assets/Logo.png"
                 width="250"
                 height="250"
                 alt="Mysta">
        </div>

    </div>


</div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="login-box">

            <a class="back-link"
                href="../../Ahmad/Homepage/index.html">
                ← Back to website
            </a>

            <h2>Log in</h2>

            <p>
                Use your work email and password.
            </p>


           <form id="loginForm">

    <div class="role">

        <button type="button" id="employee">
            <i class="fa-solid fa-users"></i>
            Employee
        </button>

        <button type="button" id="hr">
            <!-- SVG تبعك -->
            HR
        </button>

    </div>

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        minlength="6"
        required
    >
<p id="message"></p>
    <button type="submit" id="login">
        Log in ↗
    </button>


</form>

        </div>

    </div>


    <script src="script.js?v=login-message-1"></script>
    <script src="../../demo/flow.js"></script>

</body>

</html>
