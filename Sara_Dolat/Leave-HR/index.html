<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Requests</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="leave">

    <!-- Sidebar -->
    <iframe src="../../Side_Bar/Side_bar.html" title="HR navigation"></iframe>

    <div class="page">

        <!-- Header -->
        <header>
            <p>NORTHWIND / HR CONTROL PANEL</p>

            <h1>Leave requests</h1>

            <span>
                Review time-off requests and keep decisions clear.
            </span>
        </header>


        <main>

            <!-- Summary -->
            <div class="summary">

                <div class="summary-card total-card">
                    <div class="summary-icon blue">▤</div>

                    <div>
                        <h2 id="total">0</h2>
                        <p>Total Requests</p>
                    </div>
                </div>


                <div class="summary-card pending-card">
                    <div class="summary-icon yellow">◷</div>

                    <div>
                        <h2 id="pendingCount">0</h2>
                        <p>Pending</p>
                    </div>
                </div>


                <div class="summary-card approved-card">
                    <div class="summary-icon green">✓</div>

                    <div>
                        <h2 id="approvedCount">0</h2>
                        <p>Approved</p>
                    </div>
                </div>


                <div class="summary-card rejected-card">
                    <div class="summary-icon red">×</div>

                    <div>
                        <h2 id="rejectedCount">0</h2>
                        <p>Rejected</p>
                    </div>
                </div>

            </div>


            <!-- Filter -->
            <div id="filter">

                <button
                    class="active"
                    onclick="filterRequests('All')">
                    ▦ &nbsp; All
                </button>

                <button onclick="filterRequests('Pending')">
                    ◷ &nbsp; Pending
                </button>

                <button onclick="filterRequests('Approved')">
                    ✓ &nbsp; Approved
                </button>

                <button onclick="filterRequests('Rejected')">
                    × &nbsp; Rejected
                </button>

            </div>


            <!-- Requests -->
            <div id="requests"></div>

        </main>

    </div>

</div>

<script src="script.js"></script>
<script src="../../Timaaa/Dashboard-HR/sidebar.js"></script>
<script src="../../demo/flow.js"></script>
</body>
</html>
