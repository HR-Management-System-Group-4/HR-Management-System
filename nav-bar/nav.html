<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../assets/Logo-cropped.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- My CSS -->
    <link rel="stylesheet" href="nav.css">

    <title>Navbar</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg custom-navbar">

        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center gap-3" href="../Ahmad/Homepage/index.html">

                <div class="logo-box">
                    <div class="logo-bars">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <span class="brand-name">Mysta</span>

            </a>


            <!-- Mobile Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <!-- Navbar Content -->
            <div
                class="collapse navbar-collapse"
                id="navbarContent"
            >

                <!-- Links -->
                <div class="nav-links-box mx-auto">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="../Sara_Dolat/log in/index.html" data-service-page="profile">Profile</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../Sara_Dolat/log in/index.html" data-service-page="home">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../Yasmeen_Telfah/aboutUs.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="../Ahmad/Homepage/index.html#contact">Contact Us</a>
                        </li>

                    </ul>

                </div>


                <!-- Right Side -->
                <div class="d-flex align-items-center gap-3 right-buttons">

                    <!-- Dark Mode -->
                    <button class="theme-btn">
                        <i class="bi bi-moon"></i>
                    </button>


                    <!-- Sign In -->
                    <button class="signin-btn">
                        Sign in
                        <i class="bi bi-arrow-up-right"></i>
                    </button>

                </div>

            </div>

        </div>

    </nav>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
 </script>
    <script src="../layout/header.js"></script>
    <script>
        document.querySelectorAll('[data-service-page]').forEach((link) => {
            link.href = link.dataset.servicePage === 'profile'
                ? window.MystaServiceRouting.profileUrl()
                : window.MystaServiceRouting.pageUrl(link.dataset.servicePage);
        });
    </script>

</body>
</html>
