<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../../assets/Logo-cropped.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../../layout/header.css">
    <link rel="stylesheet" href="../../layout/footer.css">

    <link rel="stylesheet" href="edit-profile.css">

    <title>Edit Profile</title>
</head>

<body>

<div class="nav-bar"></div>

<!-- Main -->

<!-- Main -->
<main class="edit-profile">

    <div class="page-title">
        <div>
            <h1>Edit Profile</h1>
            <p>Update your personal and contact information.</p>
        </div>

        <a href="../../Timaaa/services/index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Services
        </a>
    </div>

    <form id="editProfileForm" novalidate>

        <!-- Profile Image -->
        <section class="profile-section">
            <h2>
                <i class="bi bi-person-circle"></i>
                Profile Photo
            </h2>

            <div class="profile-image">

                <img
                    src="../photo.jpg"
                    alt="Profile"
                    id="editProfileImage">

                <div class="image-input">

    <label for="profileImage" class="upload-btn">
        <i class="bi bi-cloud-arrow-up"></i>
        Upload New Photo
    </label>

    <input
        type="file"
        id="profileImage"
        accept=".jpg,.jpeg,.png"
        hidden
    >

    <p id="fileName">
        JPG or PNG. Maximum 1MB.
    </p>

</div>
            </div>
        </section>


        <!-- Personal Information -->
        <section class="profile-section">

            <h2>
                <i class="bi bi-person"></i>
                Personal Information
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input
                        type="text"
                        id="employeeId"
                        readonly>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        readonly>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone">
                </div>

                <div class="form-group">
                    <label for="position">Position</label>
                    <input
                        type="text"
                        id="position"
                        readonly>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <input
                        type="text"
                        id="department"
                        readonly>
                </div>

            </div>
        </section>


        <!-- Emergency Contact -->
        <section class="profile-section">

            <h2>
                <i class="bi bi-heart"></i>
                Emergency Contact
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="contactName">
                        Contact Name
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        name="contactName">
                </div>

                <div class="form-group">
                    <label for="contactPhone">
                        Contact Phone
                    </label>

                    <input
                        type="tel"
                        id="contactPhone"
                        name="contactPhone">
                </div>

            </div>
        </section>


        <!-- Buttons -->
        <div class="buttons">

            <a
                href="../Employee-profile/Profile.html"
                class="cancel-btn">
                Cancel
            </a>

            <button type="submit" class="save-btn">
                <i class="bi bi-check2"></i>
                Save Changes
            </button>

        </div>

    </form>

</main>


<!-- Footer -->
<div class="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../layout/footer.js"></script>
<script src="../../layout/header.js"></script>
<script src="edit-profile.js"></script>
<script src="../../demo/flow.js"></script>
</body>
</html>
