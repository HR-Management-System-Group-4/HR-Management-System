
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Profile | Mysta</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="hr.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Mysta</h2>

        <nav class="sidebar-menu">

            <a href="../../Timaaa/Dashboard-HR/index.html">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="../../Yasmeen_Telfah/employeeManagement.html">
                <i class="fa-solid fa-users"></i>
                Employees
            </a>

            <a href="../../Ahmad/HR-tasks/index.html">
                <i class="fa-solid fa-list-check"></i>
                Task Management
            </a>

            <a href="../../Sara_Dolat/Leave-HR/index.html">
                <i class="fa-solid fa-calendar-days"></i>
                Leave Requests
            </a>

            <a href="../../Ahmad/HR-zoom/index.html">
                <i class="fa-solid fa-video"></i>
                Meetings
            </a>

            <a href="../../Sara_Dolat/company%20policies/index.html">
                <i class="fa-solid fa-file-lines"></i>
                Policies
            </a>

            <a href="../../Sara_Sawalmeh/Feedback_HR/Feedback_HR.html">
                <i class="fa-solid fa-comment-dots"></i>
                Feedback Inbox
            </a>

        </nav>

        <div class="sidebar-footer">

            <a href="../../Ahmad/Homepage/index.html">
                <i class="fa-solid fa-house"></i>
                Home
            </a>

            <a href="../../Sara_Dolat/log%20in/index.html"
               onclick="localStorage.removeItem('user'); localStorage.removeItem('loggedInUserId')">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>
    </aside>


    <!-- PAGE CONTENT -->
    <div class="page-content">

        <!-- Hidden elements for existing JavaScript compatibility -->
        <div hidden>
            <img id="topImage" alt="">
            <span id="topName"></span>
        </div>

        <main class="hr-profile-main">

            <!-- PROFILE HEADER -->
            <section class="profile-header">

                <div class="profile-left">

                    <div class="hr-photo">

                        <img
                            id="profileImage"
                            src="../photo.jpg"
                            class="profile-pic"
                            alt="HR Profile">

                        <label
                            for="imageInput"
                            id="photoBtn"
                            class="change-photo"
                            hidden>
                            <i class="bi bi-camera"></i>
                        </label>

                        <input
                            type="file"
                            id="imageInput"
                            accept="image/png,image/jpeg"
                            hidden>

                    </div>

                    <div class="profile-intro">

                        <div class="profile-name">
                            <h2 id="headerName">Loading...</h2>
                        </div>

                        <p id="headerJob">Loading...</p>

                        <div class="profile-badges">
                            <span id="headerId">--</span>
                            <span id="headerStatus">--</span>
                        </div>

                    </div>

                </div>

                <div class="hr-buttons">

                    <button id="editBtn" type="button">
                        <i class="bi bi-pencil-square"></i>
                        Edit Profile
                    </button>

                    <button id="cancelBtn" type="button" hidden>
                        Cancel
                    </button>

                    <button
                        id="saveBtn"
                        type="submit"
                        form="hrForm"
                        hidden>
                        <i class="bi bi-check2"></i>
                        Save Changes
                    </button>

                </div>

            </section>


            <!-- PROFILE CONTENT -->
            <div class="profile-content">

                <!-- PERSONAL INFORMATION -->
                
<form id="hrForm" class="card profile-information" novalidate>

    <h3>
        <i class="fa-solid fa-user"></i>
        Profile Information
    </h3>

    <div class="info-row">
        <label for="name">
            <i class="bi bi-person"></i>
            Full Name
        </label>
        <input id="name" type="text" required>
    </div>

    <div class="info-row">
        <label for="email">
            <i class="bi bi-envelope"></i>
            Email
        </label>
        <input id="email" type="email" required>
    </div>

    <div class="info-row">
        <label for="phone">
            <i class="bi bi-telephone"></i>
            Phone
        </label>
        <input id="phone" type="tel">
    </div>

    <div class="info-row">
        <span class="field-label">
            <i class="bi bi-person-vcard"></i>
            Employee ID
        </span>
        <strong id="employeeId">--</strong>
    </div>

    <div class="info-row">
        <label for="position">
            <i class="bi bi-briefcase"></i>
            Position
        </label>
        <input id="position" type="text" required>
    </div>

    <div class="info-row">
        <label for="department">
            <i class="bi bi-building"></i>
            Department
        </label>
        <input id="department" type="text" required>
    </div>

    <div class="info-row">
        <label for="contactName">
            <i class="bi bi-heart"></i>
            Emergency Contact
        </label>

        <div class="contact-fields">
            <input
                id="contactName"
                type="text"
                placeholder="Contact Name">

            <input
                id="contactPhone"
                type="tel"
                placeholder="Contact Phone">
        </div>
    </div>

    <div class="info-row">
        <label for="startDate">
            <i class="bi bi-calendar3"></i>
            Join Date
        </label>
        <input id="startDate" type="date" required>
    </div>

</form>



                <!-- RIGHT SIDE -->
                <div class="right-side">

                    <!-- EMPLOYMENT DETAILS -->
                    <section class="card">

                        <h3>
                            <i class="fa-solid fa-briefcase"></i>
                            Employment Details
                        </h3>

                        <div class="employment-row">

                            <label for="employmentType">Type</label>

                            <select
                                id="employmentType"
                                form="hrForm">
                                <option>Full-Time</option>
                                <option>Part-Time</option>
                                <option>Contract</option>
                            </select>

                        </div>

                        <div class="employment-row">

                            <label for="workLocation">Location</label>

                            <select
                                id="workLocation"
                                form="hrForm">
                                <option>On-Site</option>
                                <option>Remote</option>
                                <option>Hybrid</option>
                            </select>

                        </div>

                        <div class="employment-row">

                            <label for="accountState">Status</label>

                            <select
                                id="accountState"
                                form="hrForm">
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>

                        </div>

                        <div class="employment-row">
                            <span>Start Date</span>
                            <strong id="displayDate">--</strong>
                        </div>

                    </section>


                    <!-- QUICK ACCESS -->
                    <section class="card">

                        <h3>
                            <i class="fa-solid fa-bolt"></i>
                            Quick Access
                        </h3>

                        <a href="../../Yasmeen_Telfah/employeeManagement.html"
                           class="action-row">

                            <span>
                                <i class="fa-solid fa-users"></i>
                                Manage Employees
                            </span>

                            <i class="fa-solid fa-chevron-right"></i>
                        </a>

                        <a href="../../Sara_Dolat/Leave-HR/index.html"
                           class="action-row">

                            <span>
                                <i class="fa-solid fa-calendar-check"></i>
                                Leave Requests
                            </span>

                            <i class="fa-solid fa-chevron-right"></i>
                        </a>

                        <a href="../../Ahmad/HR-tasks/index.html"
                           class="action-row">

                            <span>
                                <i class="fa-solid fa-list-check"></i>
                                Task Management
                            </span>

                            <i class="fa-solid fa-chevron-right"></i>
                        </a>

                        <a href="../../Sara_Dolat/company%20policies/index.html"
                           class="action-row">

                            <span>
                                <i class="fa-solid fa-file-lines"></i>
                                Company Policies
                            </span>

                            <i class="fa-solid fa-chevron-right"></i>
                        </a>

                    </section>

                </div>

            </div>

        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="hr.js"></script>
    <script src="../../demo/flow.js"></script>

</body>
</html>
